# Fly.io 部署配置
#
# 首次部署（按顺序）：
#   fly auth login
#   fly apps create gcgcm-life-game
#   fly volumes create mlg_data --size 1 --region lhr --yes   # lhr = 伦敦，离格拉斯哥最近
#   fly deploy
#
# 正式活动前务必改掉默认 PIN：
#   fly secrets set STAFF_PIN=你们的PIN ADMIN_PIN=只有负责人知道的PIN
#   （set 之后会自动重启，PIN 存在数据库里，改完要重置一次或删库才生效 ——
#     见 README「换掉默认 PIN」一节）

app = "gcgcm-life-game"
# 卷建在了 ams，机器必须和卷同区，所以这里跟着写 ams。
# 想换回伦敦得先把卷删掉在 lhr 重建（库是空的就没损失）：
#   fly volumes destroy <id> && fly volumes create mlg_data --size 1 --region lhr --yes
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  MLG_DATA_DIR = "/data"

# SQLite 必须挂持久卷，否则每次重启数据全没
[mounts]
  source = "mlg_data"
  destination = "/data"

[http_service]
  # 必须和应用实际监听的端口一致。fly launch 会把它改成默认的 8080，
  # 一旦不一致，健康检查（从机器内部访问 3000）照常通过，
  # 但 Fly 的代理往 8080 转发会被拒，外面只看到超时 —— 很难查。
  internal_port = 3000
  force_https = true          # 摄像头和 Service Worker 都要求安全上下文
  auto_stop_machines = false  # 活动当天绝对不能休眠
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

# WebSocket（socket.io）需要粘性到同一台机器；单机部署最省心
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 3000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
