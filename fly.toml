# fly.toml app configuration file generated for gcgcm-life-game on 2026-08-31T15:47:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gcgcm-life-game'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  MLG_DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'mlg_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
