# Render.com 部署配置
# 注意：必须用带磁盘的付费实例（starter $7/月）。
# 免费实例的文件系统是临时的，而且会自动休眠 —— SQLite 数据会丢，活动当天绝对不能用。
services:
  - type: web
    name: mini-life-game
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: MLG_DATA_DIR
        value: /data
      - key: PORT
        value: 3000
      - key: STAFF_PIN
        sync: false        # 在 Render 后台手动填，不要提交进代码库
      - key: ADMIN_PIN
        sync: false
    disk:
      name: mlg-data
      mountPath: /data
      sizeGB: 1
